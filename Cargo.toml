[package]
name = "dpegfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A pixel-backed virtual filesystem stored in a lossless PNG image"
repository = "https://github.com/crypto-su/dpegfs"
license = "MIT"
readme = "README.md"
exclude = ["demo-output/**", "*.dpegfs.lock", ".dpegfs-*"]
keywords = ["filesystem", "png", "storage", "compression", "pixels"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
